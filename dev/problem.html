<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; width:900px; height:420px; background:#fdfcf8; font-family:"Microsoft YaHei","SimSun",serif; color:#1a1a1a; }
  .paper { padding:44px 56px; }
  h2 { font-size:20px; margin:0 0 22px; color:#333; border-bottom:2px solid #999; padding-bottom:10px; }
  p { font-size:21px; line-height:2.1; margin:0; }
  .num { font-weight:bold; }
</style>
</head>
<body>
  <div class="paper">
    <h2>物理 · 抛体运动（计算题）</h2>
    <p><span class="num">3.</span> 某同学在地面上将一石块以 20 m/s 的初速度斜向上抛出，抛出方向与水平面成 30° 角。忽略空气阻力，取 g = 9.8 m/s²。</p>
    <p>求：（1）石块在空中的飞行时间；（2）石块上升的最大高度；（3）石块落地点到抛出点的水平距离。</p>
  </div>
</body>
